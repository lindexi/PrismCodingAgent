name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Build
        run: dotnet build -c Release PrismCodingAgent.slnx

      - name: Test
        timeout-minutes: 20
        run: dotnet test -c Release --framework net10.0 --no-build PrismCodingAgent.slnx --settings Test.runsettings --blame-hang --blame-hang-timeout 2m --logger trx --results-directory TestResults

